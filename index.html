<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planer Layoutu Stoiska Targowego</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .booth-object {
            position: absolute;
            box-sizing: border-box;
            cursor: move;
            user-select: none;
            touch-action: none;
        }
        .booth-object.selected {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
            z-index: 999 !important;
        }
        #marqueeBox {
            position: absolute;
            border: 2px dashed #2563eb;
            background-color: rgba(37, 99, 235, 0.08);
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen overflow-hidden flex flex-col select-none" oncontextmenu="return false;">

    <!-- Górny pasek nawigacyjny -->
    <header class="bg-slate-900 text-white px-4 py-2.5 flex flex-wrap justify-between items-center shadow-md z-30 shrink-0 gap-3">
        <div class="flex items-center space-x-3">
            <button onclick="toggleMobileSidebar()" class="md:hidden bg-slate-800 p-2 rounded text-slate-200 hover:text-white" title="Przełącz menu boczne">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="bg-blue-600 p-2 rounded-lg text-white shadow-md">
                <i class="fa-solid fa-compass-drafting text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-base md:text-lg leading-tight">Planer Layoutu Stoiska Targowego</h1>
                <p class="text-xs text-slate-400 hidden sm:block">Skala: 100px = 1m | LPM: przesuwanie/obiekty | PPM: zaznaczanie ramką</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <button onclick="selectAllObjects()" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs md:text-sm px-3 py-1.5 rounded-md transition border border-slate-700 shadow-sm" title="Zaznacz wszystkie obiekty na planszy">
                <i class="fa-solid fa-check-double text-blue-400"></i>
                <span class="hidden sm:inline">Zaznacz wszystko</span>
            </button>

            <button onclick="document.getElementById('json-input').click()" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs md:text-sm px-3 py-1.5 rounded-md transition border border-slate-700 shadow-sm" title="Wczytaj projekt z pliku JSON">
                <i class="fa-solid fa-folder-open text-amber-400"></i>
                <span>Otwórz JSON</span>
            </button>
            <input type="file" id="json-input" accept=".json" class="hidden" onchange="loadFromJson(event)">

            <button onclick="saveToJson()" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs md:text-sm px-3 py-1.5 rounded-md transition border border-slate-700 shadow-sm" title="Zapisz projekt do pliku JSON">
                <i class="fa-solid fa-floppy-disk text-emerald-400"></i>
                <span>Zapisz JSON</span>
            </button>

            <button onclick="exportToPng()" class="flex items-center space-x-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm px-3 py-1.5 rounded-md transition shadow-sm" title="Eksportuj widok do pliku PNG">
                <i class="fa-solid fa-image"></i>
                <span>Eksport PNG</span>
            </button>

            <button onclick="togglePropertiesPanel()" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs md:text-sm px-3 py-1.5 rounded-md transition border border-slate-700 shadow-sm relative" title="Właściwości zaznaczonego elementu">
                <i class="fa-solid fa-sliders text-purple-400"></i>
                <span class="hidden sm:inline">Właściwości</span>
            </button>
        </div>
    </header>

    <!-- Główna zawartość -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Panel boczny -->
        <aside id="sidebar" class="absolute md:relative z-20 inset-y-0 left-0 w-80 bg-white border-r border-slate-200 flex flex-col shadow-lg transition-transform duration-300 -translate-x-full md:translate-x-0">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h2 class="font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-shapes text-blue-600"></i> Katalog Elementów
                </h2>
                <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                <!-- Sekcja: Tło / Mapa -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-500 block">Rzut Hali / Tło</label>
                    <div class="flex items-center gap-2">
                        <button onclick="document.getElementById('bg-image-input').click()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 text-xs py-2 px-3 rounded font-medium transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-map text-blue-600"></i> Dodaj / Zmień plan hali
                        </button>
                        <button onclick="removeBackground()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs p-2 rounded transition" title="Usuń tło">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    <input type="file" id="bg-image-input" accept="image/*" class="hidden" onchange="loadBackgroundImage(event)">
                </div>

                <!-- Sekcja: Elementy stoiska (dynamicznie generowane z podanej listy) -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-500 block">Wyposażenie stoiska</label>
                    <div id="catalogGrid" class="grid grid-cols-1 gap-2">
                        <!-- Wypełniane przez JS -->
                    </div>
                </div>

                <!-- Sekcja: Ustawienia siatki -->
                <div class="space-y-3 pt-4 border-t border-slate-200">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-500 block">Ustawienia siatki</label>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-600">Widoczność siatki (1m = 100px)</span>
                        <input type="checkbox" id="gridToggle" checked onchange="toggleGrid()" class="rounded text-blue-600 focus:ring-blue-500">
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs text-slate-600">
                            <span>Przyciąganie do siatki</span>
                            <span id="snapValue">25 px (0.25m)</span>
                        </div>
                        <input type="range" id="snapSlider" min="10" max="100" value="25" step="5" oninput="updateSnap(this.value)" class="w-full accent-blue-600">
                    </div>
                </div>
            </div>
        </aside>

        <!-- Główny obszar roboczy -->
        <main id="viewport" class="flex-1 relative overflow-hidden bg-slate-200 cursor-grab active:cursor-grabbing">
            <!-- 1 metr = 100px, więc główna kratka siatki to 100x100px, podziałki co 20px -->
            <div id="world" class="absolute origin-top-left w-[5000px] h-[5000px]" style="transform: translate(0px, 0px) scale(1); background-size: 100px 100px, 20px 20px; background-image: linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);">
                <div id="backgroundLayer" class="absolute inset-0 pointer-events-none z-0"></div>
                <div id="objectsLayer" class="absolute inset-0 z-10"></div>
            </div>
            <div id="marqueeBox"></div>
        </main>

        <!-- Panel Właściwości -->
        <div id="propertiesPanel" class="absolute right-0 top-0 bottom-0 w-80 bg-white border-l border-slate-200 shadow-2xl z-40 flex flex-col transform translate-x-full transition-transform duration-300">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-purple-600"></i> Właściwości Elementu
                </h3>
                <button onclick="togglePropertiesPanel()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="propertiesContent">
                <p class="text-xs text-slate-500 italic text-center py-8">Wybierz obiekt, aby edytować jego właściwości.</p>
            </div>
        </div>

    </div>

    <script>
        // Katalog elementów (skala: 1 metr = 100 pikseli)
        const catalogItems = [
            { type: 'kallax_1x4', name: 'Kallax 1x4', w: 0.42, h: 0.39, color: '#475569', icon: 'fa-cubes' },
            { type: 'kallax_2x4', name: 'Kallax 2x4', w: 0.77, h: 0.39, color: '#475569', icon: 'fa-cubes' },
            { type: 'kallax_3x4', name: 'Kallax 3x4', w: 1.12, h: 0.39, color: '#475569', icon: 'fa-cubes' },
            { type: 'kallax_4x4', name: 'Kallax 4x4', w: 1.47, h: 0.39, color: '#475569', icon: 'fa-cubes' },
            { type: 'billie', name: 'Regał Billie', w: 0.80, h: 0.20, color: '#64748b', icon: 'fa-book-open' },
            { type: 'trolley', name: 'Wózek jezdny', w: 0.92, h: 0.58, color: '#d97706', icon: 'fa-truck-ramp-box' },
            { type: 'rot_silver', name: 'Ekspozytor obrotowy (srebro)', w: 0.40, h: 0.40, color: '#94a3b8', icon: 'fa-arrows-spin' },
            { type: 'rot_black', name: 'Ekspozytor obrotowy (czarny)', w: 0.45, h: 0.45, color: '#334155', icon: 'fa-arrows-spin' },
            { type: 'disp_white', name: 'Ekspozytor biały', w: 0.845, h: 0.46, color: '#e2e8f0', icon: 'fa-box-open' },
            { type: 'table_large', name: 'Stół duży', w: 1.80, h: 0.74, color: '#1e293b', icon: 'fa-table' },
            { type: 'table_small', name: 'Stół mały', w: 1.50, h: 0.73, color: '#334155', icon: 'fa-table' },
            { type: 'cash_desk', name: 'Kasa / Stolik', w: 0.70, h: 0.50, color: '#059669', icon: 'fa-cash-register' },
            { type: 'chair', name: 'Krzesło / Hoker', w: 0.45, h: 0.45, color: '#475569', icon: 'fa-chair' },
            { type: 'table_round', name: 'Stolik okrągły', w: 0.80, h: 0.80, color: '#d97706', icon: 'fa-circle' },
            { type: 'rollup', name: 'Roll-up banner', w: 0.85, h: 0.30, color: '#10b981', icon: 'fa-scroll' }
        ];

        let objects = [];
        let selectedIds = new Set();
        let backgroundData = { url: '', x: 0, y: 0, scale: 1, width: 800, height: 600 };
        
        let panX = 100, panY = 100, zoom = 1;
        let isPanning = false, isMarqueeSelecting = false;
        let startPanX = 0, startPanY = 0;
        let marqueeStartX = 0, marqueeStartY = 0;
        
        let snapSize = 25; // domyślnie 25px (0.25m)
        let gridEnabled = true;

        window.addEventListener('DOMContentLoaded', () => {
            renderCatalog();
            const viewport = document.getElementById('viewport');
            
            viewport.addEventListener('mousedown', (e) => {
                if (e.target === viewport || e.target.id === 'world' || e.target.id === 'backgroundLayer' || e.target.id === 'objectsLayer') {
                    if (e.button === 0) {
                        isPanning = true;
                        startPanX = e.clientX - panX;
                        startPanY = e.clientY - panY;
                    } else if (e.button === 2) {
                        startMarquee(e);
                    }
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    panX = e.clientX - startPanX;
                    panY = e.clientY - startPanY;
                    updateTransform();
                } else if (isMarqueeSelecting) {
                    updateMarquee(e);
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (isPanning) isPanning = false;
                if (isMarqueeSelecting && e.button === 2) endMarquee(e);
            });

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 1.1;
                let newZoom = e.deltaY < 0 ? zoom * zoomFactor : zoom / zoomFactor;
                newZoom = Math.max(0.1, Math.min(15, newZoom));

                const rect = viewport.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                panX = mouseX - (mouseX - panX) * (newZoom / zoom);
                panY = mouseY - (mouseY - panY) * (newZoom / zoom);
                zoom = newZoom;

                updateTransform();
            }, { passive: false });

            updateTransform();
            renderObjects();
        });

        function renderCatalog() {
            const container = document.getElementById('catalogGrid');
            container.innerHTML = '';
            catalogItems.forEach(item => {
                const btn = document.createElement('button');
                // Przeliczenie metrów na piksele (1m = 100px)
                const widthPx = Math.round(item.w * 100);
                const heightPx = Math.round(item.h * 100);
                
                btn.className = "bg-slate-50 hover:bg-slate-100 border border-slate-200 p-2 rounded text-left transition flex items-center justify-between group";
                btn.innerHTML = `
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <i class="fa-solid ${item.icon} text-slate-500 w-5 text-center"></i>
                        <div class="truncate">
                            <div class="text-xs font-medium text-slate-800 truncate">${item.name}</div>
                            <div class="text-[10px] text-slate-400">${item.w}m × ${item.h}m</div>
                        </div>
                    </div>
                    <span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-mono group-hover:bg-blue-600 group-hover:text-white transition">+</span>
                `;
                btn.onclick = () => addNewObject(item.type, item.name, widthPx, heightPx, item.color);
                container.appendChild(btn);
            });
        }

        function updateTransform() {
            document.getElementById('world').style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        }

        function togglePropertiesPanel() {
            document.getElementById('propertiesPanel').classList.toggle('translate-x-full');
        }

        function toggleMobileSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function toggleGrid() {
            gridEnabled = document.getElementById('gridToggle').checked;
            document.getElementById('world').style.backgroundImage = gridEnabled ? 
                'linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px)' : 'none';
        }

        function updateSnap(val) {
            snapSize = parseInt(val);
            const meters = (snapSize / 100).toFixed(2);
            document.getElementById('snapValue').textContent = `${snapSize} px (${meters}m)`;
        }

        function addNewObject(type, name, width, height, color) {
            const viewport = document.getElementById('viewport');
            const centerX = (viewport.clientWidth / 2 - panX) / zoom;
            const centerY = (viewport.clientHeight / 2 - panY) / zoom;

            const newObj = {
                id: 'obj_' + Date.now() + Math.random().toString(36.substr(2, 5)),
                type: type,
                name: name + ' ' + (objects.length + 1),
                x: Math.round(centerX - width / 2),
                y: Math.round(centerY - height / 2),
                width: width,
                height: height,
                color: color,
                rotation: 0
            };

            objects.push(newObj);
            selectedIds.clear();
            selectedIds.add(newObj.id);
            renderObjects();
            updatePropertiesPanel();
            document.getElementById('propertiesPanel').classList.remove('translate-x-full');
        }

        function renderObjects() {
            const layer = document.getElementById('objectsLayer');
            layer.innerHTML = '';

            objects.forEach(obj => {
                const el = document.createElement('div');
                el.className = `booth-object ${selectedIds.has(obj.id) ? 'selected' : ''}`;
                el.style.left = obj.x + 'px';
                el.style.top = obj.y + 'px';
                el.style.width = obj.width + 'px';
                el.style.height = obj.height + 'px';
                el.style.backgroundColor = obj.color;
                el.style.transform = `rotate(${obj.rotation || 0}deg)`;
                el.dataset.id = obj.id;

                const widthM = (obj.width / 100).toFixed(2);
                const heightM = (obj.height / 100).toFixed(2);

                el.innerHTML = `
                    <div class="w-full h-full flex flex-col items-center justify-center p-1 text-center overflow-hidden rounded shadow-sm border border-black/10">
                        <span class="text-[11px] font-bold truncate w-full text-white drop-shadow-sm">${obj.name}</span>
                        <span class="text-[9px] text-slate-200">${widthM}×${heightM}m</span>
                    </div>
                `;

                el.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    if (e.button === 0) {
                        if (!e.shiftKey && !selectedIds.has(obj.id)) {
                            selectedIds.clear();
                        }
                        selectedIds.add(obj.id);
                        renderObjects();
                        updatePropertiesPanel();
                        startDraggingObject(e, obj.id);
                    }
                });

                layer.appendChild(el);
            });
        }

        function startDraggingObject(e, objId) {
            const startMouseX = e.clientX;
            const startMouseY = e.clientY;
            const initialPositions = {};

            selectedIds.forEach(id => {
                const o = objects.find(item => item.id === id);
                if (o) initialPositions[id] = { x: o.x, y: o.y };
            });

            function onMouseMove(moveEvent) {
                const dx = (moveEvent.clientX - startMouseX) / zoom;
                const dy = (moveEvent.clientY - startMouseY) / zoom;

                selectedIds.forEach(id => {
                    const o = objects.find(item => item.id === id);
                    if (o && initialPositions[id]) {
                        let newX = initialPositions[id].x + dx;
                        let newY = initialPositions[id].y + dy;

                        if (gridEnabled) {
                            newX = Math.round(newX / snapSize) * snapSize;
                            newY = Math.round(newY / snapSize) * snapSize;
                        }

                        o.x = newX;
                        o.y = newY;
                    }
                });
                renderObjects();
            }

            function onMouseUp() {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
                updatePropertiesPanel();
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        function startMarquee(e) {
            isMarqueeSelecting = true;
            const rect = document.getElementById('viewport').getBoundingClientRect();
            marqueeStartX = e.clientX - rect.left;
            marqueeStartY = e.clientY - rect.top;

            const box = document.getElementById('marqueeBox');
            box.style.left = marqueeStartX + 'px';
            box.style.top = marqueeStartY + 'px';
            box.style.width = '0px';
            box.style.height = '0px';
            box.style.display = 'block';
        }

        function updateMarquee(e) {
            if (!isMarqueeSelecting) return;
            const rect = document.getElementById('viewport').getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            const box = document.getElementById('marqueeBox');
            box.style.left = Math.min(marqueeStartX, currentX) + 'px';
            box.style.top = Math.min(marqueeStartY, currentY) + 'px';
            box.style.width = Math.abs(currentX - marqueeStartX) + 'px';
            box.style.height = Math.abs(currentY - marqueeStartY) + 'px';
        }

        function endMarquee(e) {
            isMarqueeSelecting = false;
            document.getElementById('marqueeBox').style.display = 'none';

            const rect = document.getElementById('viewport').getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            const screenW = Math.abs(currentX - marqueeStartX);
            const screenH = Math.abs(currentY - marqueeStartY);

            if (screenW < 3 && screenH < 3) {
                selectedIds.clear();
                renderObjects();
                updatePropertiesPanel();
                return;
            }

            const worldLeft = (Math.min(marqueeStartX, currentX) - panX) / zoom;
            const worldTop = (Math.min(marqueeStartY, currentY) - panY) / zoom;
            const worldRight = worldLeft + (screenW / zoom);
            const worldBottom = worldTop + (screenH / zoom);

            if (!e.shiftKey) selectedIds.clear();

            objects.forEach(obj => {
                if (obj.x < worldRight && (obj.x + obj.width) > worldLeft && obj.y < worldBottom && (obj.y + obj.height) > worldTop) {
                    selectedIds.add(obj.id);
                }
            });

            renderObjects();
            updatePropertiesPanel();
        }

        function selectAllObjects() {
            selectedIds.clear();
            objects.forEach(o => selectedIds.add(o.id));
            renderObjects();
            updatePropertiesPanel();
        }

        function updatePropertiesPanel() {
            const container = document.getElementById('propertiesContent');
            if (selectedIds.size === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-8">Wybierz obiekt, aby edytować jego właściwości.</p>`;
                return;
            }

            if (selectedIds.size > 1) {
                container.innerHTML = `
                    <div class="space-y-4">
                        <p class="text-xs font-bold text-blue-600">Zaznaczono obiektów: ${selectedIds.size}</p>
                        <button onclick="deleteSelectedObjects()" class="w-full bg-red-600 hover:bg-red-500 text-white text-xs py-2 rounded font-medium transition shadow-sm">
                            <i class="fa-solid fa-trash-can mr-1.5"></i> Usuń zaznaczone
                        </button>
                    </div>
                `;
                return;
            }

            const id = Array.from(selectedIds)[0];
            const obj = objects.find(o => o.id === id);
            if (!obj) return;

            const widthM = (obj.width / 100).toFixed(2);
            const heightM = (obj.height / 100).toFixed(2);
            const posXm = (obj.x / 100).toFixed(2);
            const posYm = (obj.y / 100).toFixed(2);

            container.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1">Nazwa</label>
                        <input type="text" value="${obj.name}" oninput="updateObjProp('${obj.id}', 'name', this.value)" class="w-full bg-slate-50 border border-slate-300 rounded px-2.5 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Szerokość (px)</label>
                            <input type="number" value="${obj.width}" oninput="updateObjProp('${obj.id}', 'width', parseInt(this.value) || 10)" class="w-full bg-slate-50 border border-slate-300 rounded px-2.5 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                            <span class="text-[10px] text-slate-400">ok. ${widthM} m</span>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Wysokość (px)</label>
                            <input type="number" value="${obj.height}" oninput="updateObjProp('${obj.id}', 'height', parseInt(this.value) || 10)" class="w-full bg-slate-50 border border-slate-300 rounded px-2.5 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                            <span class="text-[10px] text-slate-400">ok. ${heightM} m</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Pozycja X (px)</label>
                            <input type="number" value="${obj.x}" oninput="updateObjProp('${obj.id}', 'x', parseInt(this.value) || 0)" class="w-full bg-slate-50 border border-slate-300 rounded px-2.5 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                            <span class="text-[10px] text-slate-400">${posXm} m</span>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Pozycja Y (px)</label>
                            <input type="number" value="${obj.y}" oninput="updateObjProp('${obj.id}', 'y', parseInt(this.value) || 0)" class="w-full bg-slate-50 border border-slate-300 rounded px-2.5 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                            <span class="text-[10px] text-slate-400">${posYm} m</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Obrót (°)</label>
                            <input type="number" value="${obj.rotation || 0}" oninput="updateObjProp('${obj.id}', 'rotation', parseInt(this.value) || 0)" class="w-full bg-slate-50 border border-slate-300 rounded px-2.5 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Kolor</label>
                            <input type="color" value="${obj.color}" oninput="updateObjProp('${obj.id}', 'color', this.value)" class="w-full h-8 bg-slate-50 border border-slate-300 rounded px-1 py-0.5 cursor-pointer">
                        </div>
                    </div>
                    <div class="pt-2 flex gap-2">
                        <button onclick="duplicateObject('${obj.id}')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 text-xs py-2 rounded font-medium transition">
                            <i class="fa-solid fa-copy mr-1"></i> Duplikuj
                        </button>
                        <button onclick="deleteSelectedObjects()" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs py-2 rounded font-medium transition">
                            <i class="fa-solid fa-trash-can mr-1"></i> Usuń
                        </button>
                    </div>
                </div>
            `;
        }

        function updateObjProp(id, prop, val) {
            const obj = objects.find(o => o.id === id);
            if (obj) {
                obj[prop] = val;
                renderObjects();
            }
        }

        function duplicateObject(id) {
            const obj = objects.find(o => o.id === id);
            if (!obj) return;
            const newObj = {
                ...obj,
                id: 'obj_' + Date.now() + Math.random().toString(36.substr(2, 5)),
                x: obj.x + 20,
                y: obj.y + 20,
                name: obj.name + ' (kopia)'
            };
            objects.push(newObj);
            selectedIds.clear();
            selectedIds.add(newObj.id);
            renderObjects();
            updatePropertiesPanel();
        }

        function deleteSelectedObjects() {
            objects = objects.filter(o => !selectedIds.has(o.id));
            selectedIds.clear();
            renderObjects();
            updatePropertiesPanel();
        }

        function loadBackgroundImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                backgroundData.url = e.target.result;
                const img = new Image();
                img.onload = function() {
                    backgroundData.width = img.width;
                    backgroundData.height = img.height;
                    renderBackground();
                };
                img.src = backgroundData.url;
            };
            reader.readAsDataURL(file);
        }

        function renderBackground() {
            const layer = document.getElementById('backgroundLayer');
            if (!backgroundData.url) {
                layer.innerHTML = '';
                return;
            }
            layer.innerHTML = `
                <div style="position: absolute; left: ${backgroundData.x}px; top: ${backgroundData.y}px; width: ${backgroundData.width}px; height: ${backgroundData.height}px; transform: scale(${backgroundData.scale}); transform-origin: top left;">
                    <img src="${backgroundData.url}" class="w-full h-full object-contain pointer-events-none select-none">
                </div>
            `;
        }

        function removeBackground() {
            backgroundData.url = '';
            renderBackground();
        }

        function saveToJson() {
            const data = { objects: objects, background: backgroundData };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'projekt_stoiska.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadFromJson(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.objects) objects = data.objects;
                    if (data.background) {
                        backgroundData = data.background;
                        renderBackground();
                    }
                    selectedIds.clear();
                    renderObjects();
                    updatePropertiesPanel();
                } catch (err) {
                    alert('Błąd podczas wczytywania pliku JSON.');
                }
            };
            reader.readAsText(file);
        }

        function exportToPng() {
            const prevSelected = new Set(selectedIds);
            selectedIds.clear();
            renderObjects();

            html2canvas(document.getElementById('world'), { backgroundColor: '#f1f5f9', scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'layout_stoiska.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                selectedIds = prevSelected;
                renderObjects();
            });
        }
    </script>
</body>
</html>
