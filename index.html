<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planer Stoisk Targowych CAD</title>
    
    <!-- Tailwind CSS CDN dla nowoczesnego stylowania interfejsu -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome CDN dla czytelnych ikon systemowych -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2canvas CDN do bezstratnego eksportu planszy do pliku PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ==========================================================================
           SEKCJA STYLÓW GLOBALNYCH ORAZ EFEKTÓW MICA (WINDOWS 11 / CANVA STYLE)
           ========================================================================== */
        body {
            font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
        }
        /* Estetyczne, cienkie paski przewijania (scrollbary) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Styl okien w stylu Windows 11 z efektem rozmycia tła (Glassmorphism / Mica) */
        .win11-mica {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .win11-dark-mica {
            background: rgba(30, 30, 30, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        /* Płynne animacje dla elementów obrotowych kompasu */
        .compass-ring {
            transition: transform 0.1s ease-out;
        }
        /* Klasa reprezentująca pojedynczy mebel/obiekt na planszy projektu */
        .booth-object {
            position: absolute;
            box-sizing: border-box;
            cursor: move;
            user-select: none;
            touch-action: none;
        }
        /* Efekt zaznaczonego obiektu na planszy (niebieska ramka robocza Windows 11) */
        .booth-object.selected {
            outline: 2px solid #0067c0;
            outline-offset: 2px;
            z-index: 999 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 103, 192, 0.3);
        }
        /* Style dla technicznych linii wymiarowych SVG w stylu CAD */
        .dimension-line {
            stroke: #0067c0;
            stroke-width: 1.5;
            stroke-dasharray: 3 3;
        }
        .dimension-boundary {
            stroke: #ef4444;
            stroke-width: 1.5;
        }
    </style>
</head>
<body class="bg-slate-100 h-full flex flex-col overflow-hidden text-slate-800">

    <!-- Główny kontener aplikacji -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Pasek narzędzi / Panel boczny -->
        <aside class="w-80 win11-mica border-r border-slate-200 flex flex-col z-20 shadow-lg">
            <div class="p-4 border-b border-slate-200 flex items-center justify-between">
                <h1 class="font-semibold text-lg text-slate-800"><i class="fa-solid fa-compass-drafting text-blue-600 mr-2"></i> Planer CAD</h1>
                <span class="text-xs bg-blue-100 text-blue-700 font-medium px-2 py-0.5 rounded">v1.2</span>
            </div>

            <div class="p-4 flex-1 overflow-y-auto space-y-4">
                <!-- Informacja o sterowaniu -->
                <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg text-xs text-blue-800 space-y-1">
                    <p class="font-semibold"><i class="fa-solid fa-circle-info mr-1"></i> Sterowanie precyzyjne:</p>
                    <p>Zaznacz obiekt i użyj klawiszy:</p>
                    <p>• <b>Strzałki</b> – ruch o domyślny skok</p>
                    <p>• <b>+ / -</b> – przesuwanie o <b>1 px</b> (X i Y / skala)</p>
                </div>

                <!-- Panel właściwości wybranego obiektu -->
                <div id="properties-panel" class="bg-white/80 border border-slate-200 p-3 rounded-lg shadow-sm hidden">
                    <h3 class="font-medium text-sm mb-2 text-slate-700">Właściwości obiektu</h3>
                    <div class="space-y-2 text-xs">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500">Pozycja X:</span>
                            <span id="prop-x" class="font-mono font-medium">0 px</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500">Pozycja Y:</span>
                            <span id="prop-y" class="font-mono font-medium">0 px</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Obszar roboczy / Plansza CAD -->
        <main class="flex-1 relative bg-slate-200 overflow-auto flex items-center justify-center p-8" id="canvas-container">
            <div id="drawing-board" class="w-[1200px] h-[800px] bg-white relative shadow-2xl overflow-hidden border border-slate-300">
                <!-- Przykładowy obiekt testowy do zaznaczenia -->
                <div class="booth-object selected bg-blue-500/20 border-2 border-blue-600 rounded flex items-center justify-center text-blue-900 font-semibold text-sm" style="left: 100px; top: 100px; width: 150px; height: 100px;" id="sample-booth">
                    Stoisko A1 (Kliknij)
                </div>
            </div>
        </main>
    </div>

    <script>
        // Logika obsługi przesuwania obiektów za pomocą klawiszy (w tym + i - o 1 piksel)
        let selectedObject = document.getElementById('sample-booth');

        // Obsługa kliknięcia w celu zaznaczenia obiektu
        document.querySelectorAll('.booth-object').forEach(obj => {
            obj.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.booth-object').forEach(o => o.classList.remove('selected'));
                obj.classList.add('selected');
                selectedObject = obj;
                updateProperties();
            });
        });

        // Kliknięcie w tło odznacza obiekt
        document.getElementById('drawing-board').addEventListener('click', () => {
            // Ocpcjonalnie można odznaczać, ale pozostawiamy aktywne dla wygody
        });

        function updateProperties() {
            if (!selectedObject) return;
            document.getElementById('properties-panel').classList.remove('hidden');
            document.getElementById('prop-x').innerText = parseInt(selectedObject.style.left || 0) + ' px';
            document.getElementById('prop-y').innerText = parseInt(selectedObject.style.top || 0) + ' px';
        }

        // Nasłuchiwanie klawiatury dla precyzyjnego przesuwania
        window.addEventListener('keydown', (e) => {
            if (!selectedObject) return;

            // Pobieramy aktualne współrzędne
            let currentLeft = parseInt(selectedObject.style.left) || 0;
            let currentTop = parseInt(selectedObject.style.top) || 0;
            let currentWidth = parseInt(selectedObject.style.width) || selectedObject.offsetWidth;
            let currentHeight = parseInt(selectedObject.style.height) || selectedObject.offsetHeight;

            // Domyślny krok przesuwania strzałkami (np. 10px lub 1px z Shiftem)
            let step = e.shiftKey ? 1 : 10;

            let moved = false;

            switch(e.key) {
                case 'ArrowLeft':
                    selectedObject.style.left = (currentLeft - step) + 'px';
                    moved = true;
                    break;
                case 'ArrowRight':
                    selectedObject.style.left = (currentLeft + step) + 'px';
                    moved = true;
                    break;
                case 'ArrowUp':
                    selectedObject.style.top = (currentTop - step) + 'px';
                    moved = true;
                    break;
                case 'ArrowDown':
                    selectedObject.style.top = (currentTop + step) + 'px';
                    moved = true;
                    break;
                
                // DODANE: Przesuwanie osi X i Y / zmiana pozycji za pomocą plusa i minusa o 1 piksel
                // Klawisz '+' (plus / równości) lub numeryczny plus powiększa pozycję / przesuwa w prawo/dół lub modyfikuje o 1px
                case '+':
                case '=':
                    // Przesunięcie o 1 piksel w prawo i w dół (lub według preferencji: X+1, Y+1)
                    selectedObject.style.left = (currentLeft + 1) + 'px';
                    selectedObject.style.top = (currentTop + 1) + 'px';
                    moved = true;
                    e.preventDefault();
                    break;

                case '-':
                case '_':
                    // Przesunięcie o 1 piksel w lewo i w górę (X-1, Y-1)
                    selectedObject.style.left = (currentLeft - 1) + 'px';
                    selectedObject.style.top = (currentTop - 1) + 'px';
                    moved = true;
                    e.preventDefault();
                    break;
            }

            if (moved) {
                updateProperties();
            }
        });

        // Inicjalizacja panelu właściwości
        updateProperties();
    </script>
</body>
</html>
