<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sterowanie pozycją tła</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 dark:bg-zinc-900 text-gray-800 dark:text-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white dark:bg-zinc-800 p-6 rounded-xl shadow-lg w-96 space-y-4">
        <h2 class="text-lg font-semibold text-center mb-2">Pozycja Tła (X / Y)</h2>

        <!-- Podgląd elementu z tłem -->
        <div id="backgroundPreview" class="w-full h-40 rounded-lg border border-gray-300 dark:border-zinc-700 bg-repeat bg-gray-200 dark:bg-zinc-900 shadow-inner" style="background-image: radial-gradient(circle, #3b82f6 1px, transparent 1px); background-size: 20px 20px; background-position: 0px 0px;">
        </div>

        <!-- Sekcja Osi X -->
        <div class="space-y-1">
            <div class="flex justify-between text-sm">
                <span>Oś X:</span>
                <span id="bgXValue">0px</span>
            </div>
            <input type="range" id="bgXSlider" min="-100" max="100" value="0" class="w-full accent-blue-500 cursor-pointer">
            
            <!-- Przyciski +/- dla Osi X -->
            <div class="flex items-center justify-between mt-1 px-1">
                <span class="text-xs text-gray-500">Krok X (1px):</span>
                <div class="flex space-x-1">
                    <button type="button" onclick="stepBackground('x', -1)" class="w-7 h-7 bg-gray-200 hover:bg-gray-300 dark:bg-zinc-700 dark:hover:bg-zinc-600 rounded text-sm font-bold flex items-center justify-center transition-colors" title="Przesuń w lewo o 1px">-</button>
                    <button type="button" onclick="stepBackground('x', 1)" class="w-7 h-7 bg-gray-200 hover:bg-gray-300 dark:bg-zinc-700 dark:hover:bg-zinc-600 rounded text-sm font-bold flex items-center justify-center transition-colors" title="Przesuń w prawo o 1px">+</button>
                </div>
            </div>
        </div>

        <!-- Sekcja Osi Y -->
        <div class="space-y-1 pt-2">
            <div class="flex justify-between text-sm">
                <span>Oś Y:</span>
                <span id="bgYValue">0px</span>
            </div>
            <input type="range" id="bgYSlider" min="-100" max="100" value="0" class="w-full accent-blue-500 cursor-pointer">
            
            <!-- Przyciski +/- dla Osi Y -->
            <div class="flex items-center justify-between mt-1 px-1">
                <span class="text-xs text-gray-500">Krok Y (1px):</span>
                <div class="flex space-x-1">
                    <button type="button" onclick="stepBackground('y', -1)" class="w-7 h-7 bg-gray-200 hover:bg-gray-300 dark:bg-zinc-700 dark:hover:bg-zinc-600 rounded text-sm font-bold flex items-center justify-center transition-colors" title="Przesuń w górę o 1px">-</button>
                    <button type="button" onclick="stepBackground('y', 1)" class="w-7 h-7 bg-gray-200 hover:bg-gray-300 dark:bg-zinc-700 dark:hover:bg-zinc-600 rounded text-sm font-bold flex items-center justify-center transition-colors" title="Przesuń w dół o 1px">+</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pełny kod JavaScript obsługujący logikę -->
    <script>
        // Pobranie elementów DOM
        const previewElement = document.getElementById('backgroundPreview');
        const bgXSlider = document.getElementById('bgXSlider');
        const bgYSlider = document.getElementById('bgYSlider');
        const bgXValue = document.getElementById('bgXValue');
        const bgYValue = document.getElementById('bgYValue');

        // Główna funkcja aktualizująca pozycję tła na podstawie suwaków
        function updateBackgroundPosition() {
            const xVal = bgXSlider.value;
            const yVal = bgYSlider.value;

            // Aktualizacja tekstu wyświetlającego wartości
            bgXValue.textContent = xVal + 'px';
            bgYValue.textContent = yVal + 'px';

            // Zmiana stylu tła elementu podglądu
            previewElement.style.backgroundPosition = xVal + 'px ' + yVal + 'px';
        }

        // Funkcja obsługująca przyciski "+" oraz "-" z uwzględnieniem kroków o 1px
        function stepBackground(axis, delta) {
            let targetSlider = (axis === 'x') ? bgXSlider : bgYSlider;

            if (targetSlider) {
                // Obliczenie nowej wartości z uwzględnieniem kroku 1px
                let currentVal = parseInt(targetSlider.value, 10);
                if (isNaN(currentVal)) {
                    currentVal = 0;
                }
                
                let calculatedValue = currentVal + delta;

                // Sprawdzenie ograniczeń min/max zdefiniowanych na elemencie input
                let minValue = parseInt(targetSlider.min, 10);
                let maxValue = parseInt(targetSlider.max, 10);

                if (!isNaN(minValue) && calculatedValue < minValue) {
                    calculatedValue = minValue;
                }
                if (!isNaN(maxValue) && calculatedValue > maxValue) {
                    calculatedValue = maxValue;
                }

                // Przypisanie nowej wartości do suwaka
                targetSlider.value = calculatedValue;

                // Wywołanie funkcji aktualizującej widok
                updateBackgroundPosition();
            }
        }

        // Nasłuchiwanie zdarzeń zmiany pozycji na suwakach (zarówno myszką, jak i programowo)
        bgXSlider.addEventListener('input', updateBackgroundPosition);
        bgYSlider.addEventListener('input', updateBackgroundPosition);

        // Inicjalizacja stanu początkowego przy ładowaniu strony
        updateBackgroundPosition();
    </script>
</body>
</html>
